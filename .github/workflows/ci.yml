name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The optimization profile in Cargo.toml uses target-cpu=native via
  # .cargo/config.toml; CI only needs to know the code compiles and passes.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # `--all-features` cannot be used: the f32/f64 features are mutually
      # exclusive and enabling both is a deliberate compile_error!.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features f64 -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches doc links that rot when an item is renamed or moved. The
      # README's own accuracy is covered by tests, not here:
      # `the_readme_quotes_the_help_output_exactly` and
      # `the_readme_lists_every_registered_strategy`.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::private_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        precision: [f32, f64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (${{ matrix.precision }})
        run: cargo test --no-default-features --features ${{ matrix.precision }}

  # Keeps the rust-version in Cargo.toml honest rather than aspirational.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
